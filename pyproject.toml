[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "A free, local, voice-controlled personal assistant (Jarvis)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # core text mode uses only the Python standard library

[project.optional-dependencies]
voice = [
  "numpy>=1.24",
  "sounddevice>=0.4.6",
  "faster-whisper>=1.0.0",
  "pyttsx3>=2.90",
]
# "Hey Jarvis" wake word model. Best on Python 3.10-3.11 (on Linux it needs tflite-runtime).
wakeword = ["openwakeword>=0.6.0"]
system = ["psutil>=5.9", "mss>=9.0"]
all = ["jarvis-assistant[voice,system]"]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["web/*.html"]

# Copy this file to config.toml and edit it. Every setting is optional.

[assistant]
name = "Jarvis"
user_name = "Sir"
# Folder for memory, notes and reminders (created if missing).
data_dir = "data"

[llm]
# "ollama" = free and local (https://ollama.com). Run: ollama pull llama3.2
# "openai" = any OpenAI-compatible server, e.g. Groq free tier, LM Studio, llama.cpp server.
# "none"   = no AI chat, only built-in skills.
provider = "ollama"
model = "llama3.2"
base_url = "http://localhost:11434"
# For provider = "openai". Example Groq free tier:
#   base_url = "https://api.groq.com/openai/v1"
#   model = "llama-3.1-8b-instant"
#   api_key_env = "GROQ_API_KEY"
api_key_env = "OPENAI_API_KEY"
temperature = 0.6
# Let the AI call Jarvis skills (weather, notes, open apps...) by itself.
use_tools = true
history_turns = 10

[voice]
# Speech-to-text: faster-whisper model size: tiny, base, small, medium.
stt_model = "base.en"
language = "en"
# Text-to-speech engine: "pyttsx3" (offline) or "print" (no sound).
tts_engine = "pyttsx3"
tts_rate = 180
# Wake word: "openwakeword" (uses the free "hey_jarvis" model) or "text" (say "jarvis ...").
wake_engine = "openwakeword"
wake_word = "jarvis"
wake_threshold = 0.5
# Seconds of silence that end a spoken command.
silence_seconds = 1.0

[weather]
# Default city for "what's the weather".
city = "Hyderabad"

[web]
host = "127.0.0.1"
port = 5050

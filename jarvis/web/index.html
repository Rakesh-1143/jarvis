<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root { --bg:#05080f; --panel:#0c1422; --accent:#2ad4ff; --text:#d8f3ff; --muted:#6c8aa0; --me:#12324a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background: radial-gradient(circle at top, #0b1d33, var(--bg)); color: var(--text); height: 100vh; display:flex; flex-direction:column; }
  header { text-align:center; padding:18px 16px 8px; }
  .core { width:84px; height:84px; margin:0 auto 8px; border-radius:50%; border:3px solid var(--accent);
          box-shadow:0 0 24px var(--accent), inset 0 0 24px var(--accent); transition: transform .2s; }
  .core.busy { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); box-shadow:0 0 40px var(--accent), inset 0 0 30px var(--accent);} }
  h1 { margin:0; letter-spacing:.3em; font-weight:600; color:var(--accent); font-size:20px; }
  #log { flex:1; overflow-y:auto; padding:16px; max-width:760px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; margin:8px 0; max-width:85%; line-height:1.45; white-space:pre-wrap; }
  .me { background:var(--me); margin-left:auto; }
  .bot { background:var(--panel); border:1px solid #17324a; }
  form { display:flex; gap:8px; padding:12px 16px 20px; max-width:760px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #1d3b55; background:var(--panel); color:var(--text); font-size:16px; }
  button { padding:0 16px; border-radius:10px; border:0; background:var(--accent); color:#00212d; font-weight:600; font-size:15px; cursor:pointer; }
  button.mic.on { background:#ff5c7a; }
  label { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:4px; }
</style>
</head>
<body>
<header><div class="core" id="core"></div><h1>J.A.R.V.I.S</h1></header>
<div id="log"></div>
<form id="f">
  <input id="t" placeholder="Ask Jarvis anything..." autocomplete="off" autofocus>
  <button type="button" class="mic" id="mic" title="Speak">🎤</button>
  <button>Send</button>
  <label><input type="checkbox" id="voice" checked style="flex:none"> voice</label>
</form>
<script>
const log = document.getElementById('log'), core = document.getElementById('core');
const input = document.getElementById('t'), voiceBox = document.getElementById('voice');
function add(text, who) {
  const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  if (who === 'bot' && voiceBox.checked && 'speechSynthesis' in window) {
    speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }
}
async function send(text) {
  if (!text.trim()) return;
  add(text, 'me'); core.classList.add('busy');
  try {
    const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
    add((await r.json()).reply, 'bot');
  } catch (e) { add('Connection error: ' + e, 'bot'); }
  core.classList.remove('busy');
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); send(input.value); input.value = ''; };
setInterval(async () => {
  try { const r = await fetch('/api/notifications'); (await r.json()).messages.forEach(m => add(m, 'bot')); } catch (e) {}
}, 2000);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = document.getElementById('mic');
if (SR) {
  const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false;
  rec.onresult = e => send(e.results[0][0].transcript);
  rec.onend = () => mic.classList.remove('on');
  mic.onclick = () => { mic.classList.add('on'); rec.start(); };
} else { mic.disabled = true; mic.title = 'Speech recognition not supported in this browser'; }
add('Hello. I am Jarvis. Type or press the mic to talk. Say "help" to see what I can do.', 'bot');
</script>
</body>
</html>
